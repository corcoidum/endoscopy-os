name: ${COMPOSE_PROJECT_NAME:-clinic-endoscopy}

x-service-logging: &service-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-backend-common-environment: &backend-common-environment
  APP_ENV: ${APP_ENV:-production}
  TZ: ${TZ:-Asia/Seoul}
  DATABASE_HOST: postgres
  DATABASE_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB를 .env에 설정하세요}
  SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET을 .env에 설정하세요}
  FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?FIELD_ENCRYPTION_KEY를 .env에 설정하세요}
  CLINIC_HOSTNAME: ${CLINIC_HOSTNAME:?CLINIC_HOSTNAME을 .env에 설정하세요}
  ALLOWED_HOSTS: ${CLINIC_ALLOWED_HOSTS:?CLINIC_ALLOWED_HOSTS를 .env에 설정하세요}
  ALLOWED_ORIGINS: ${CLINIC_ALLOWED_ORIGINS:?CLINIC_ALLOWED_ORIGINS를 .env에 설정하세요}
  ALLOWED_SUBNETS: ${CLINIC_ALLOWED_SUBNETS:?CLINIC_ALLOWED_SUBNETS를 .env에 설정하세요}
  TRUSTED_PROXY_SUBNETS: ${TRUSTED_PROXY_SUBNETS:-172.16.0.0/12}
  TRUST_PROXY_HEADERS: "true"
  ENFORCE_INTERNAL_SUBNET: "true"
  CSRF_REQUIRE_ORIGIN: "true"
  ENABLE_API_DOCS: "false"
  SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
  SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-30}
  SESSION_ABSOLUTE_HOURS: ${SESSION_ABSOLUTE_HOURS:-12}
  MAX_LOGIN_FAILURES: ${MAX_LOGIN_FAILURES:-5}
  LOGIN_LOCK_MINUTES: ${LOGIN_LOCK_MINUTES:-15}
  LOGIN_IP_MAX_FAILURES: ${LOGIN_IP_MAX_FAILURES:-10}
  LOGIN_IP_WINDOW_MINUTES: ${LOGIN_IP_WINDOW_MINUTES:-15}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  postgres:
    image: postgres:16.14-alpine
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Seoul}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB를 .env에 설정하세요}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?POSTGRES_ADMIN_USER를 .env에 설정하세요}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD를 .env에 설정하세요}
      POSTGRES_MIGRATION_USER: ${POSTGRES_MIGRATION_USER:?POSTGRES_MIGRATION_USER를 .env에 설정하세요}
      POSTGRES_MIGRATION_PASSWORD: ${POSTGRES_MIGRATION_PASSWORD:?POSTGRES_MIGRATION_PASSWORD를 .env에 설정하세요}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:?POSTGRES_APP_USER를 .env에 설정하세요}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD를 .env에 설정하세요}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --data-checksums
    command:
      - postgres
      - -c
      - password_encryption=scram-sha-256
      - -c
      - log_statement=none
      - -c
      - log_min_error_statement=panic
      - -c
      - log_parameter_max_length=0
      - -c
      - log_parameter_max_length_on_error=0
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deployment/postgres/01-create-roles.sh:/docker-entrypoint-initdb.d/01-create-roles.sh:ro
    networks:
      - database
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /var/run/postgresql:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    logging: *service-logging

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: clinic-endoscopy/backend:${APP_VERSION:-local}
    restart: "no"
    command:
      - alembic
      - upgrade
      - head
    environment:
      <<: *backend-common-environment
      POSTGRES_USER: ${POSTGRES_MIGRATION_USER:?POSTGRES_MIGRATION_USER를 .env에 설정하세요}
      POSTGRES_PASSWORD: ${POSTGRES_MIGRATION_PASSWORD:?POSTGRES_MIGRATION_PASSWORD를 .env에 설정하세요}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - database
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *service-logging

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: clinic-endoscopy/backend:${APP_VERSION:-local}
    restart: unless-stopped
    init: true
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      # Client IP는 app.core.network가 TRUSTED_PROXY_SUBNETS 기준으로 한 번만 해석한다.
      - --no-proxy-headers
      - --no-access-log
    environment:
      <<: *backend-common-environment
      POSTGRES_USER: ${POSTGRES_APP_USER:?POSTGRES_APP_USER를 .env에 설정하세요}
      POSTGRES_PASSWORD: ${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD를 .env에 설정하세요}
    expose:
      - "8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - application
      - database
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request; request = urllib.request.Request('http://127.0.0.1:8000/health/ready', headers={'Host': os.environ['CLINIC_HOSTNAME']}); urllib.request.urlopen(request, timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *service-logging

  seed-identity:
    profiles:
      - tools
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: clinic-endoscopy/backend:${APP_VERSION:-local}
    restart: "no"
    command:
      - python
      - -m
      - app.cli.seed_identity
    environment:
      <<: *backend-common-environment
      POSTGRES_USER: ${POSTGRES_APP_USER:?POSTGRES_APP_USER를 .env에 설정하세요}
      POSTGRES_PASSWORD: ${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD를 .env에 설정하세요}
      BOOTSTRAP_ADMIN_LOGIN_ID: ${BOOTSTRAP_ADMIN_LOGIN_ID:-}
      BOOTSTRAP_ADMIN_DISPLAY_NAME: ${BOOTSTRAP_ADMIN_DISPLAY_NAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - database
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *service-logging

  seed-patients:
    profiles:
      - tools
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: clinic-endoscopy/backend:${APP_VERSION:-local}
    restart: "no"
    command:
      - python
      - -m
      - app.cli.seed_patients
    environment:
      <<: *backend-common-environment
      POSTGRES_USER: ${POSTGRES_APP_USER:?POSTGRES_APP_USER를 .env에 설정하세요}
      POSTGRES_PASSWORD: ${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD를 .env에 설정하세요}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - database
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *service-logging

  seed-appointments:
    profiles:
      - tools
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: clinic-endoscopy/backend:${APP_VERSION:-local}
    restart: "no"
    command:
      - python
      - -m
      - app.cli.seed_appointments
      - --start-date
      - "2026-09-01"
      - --end-date
      - "2026-09-19"
    environment:
      <<: *backend-common-environment
      POSTGRES_USER: ${POSTGRES_APP_USER:?POSTGRES_APP_USER를 .env에 설정하세요}
      POSTGRES_PASSWORD: ${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD를 .env에 설정하세요}
    depends_on:
      seed-patients:
        condition: service_completed_successfully
    networks:
      - database
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *service-logging

  frontend-build:
    build:
      context: ./frontend
      target: artifact
    image: clinic-endoscopy/frontend-artifact:${APP_VERSION:-local}
    restart: "no"
    network_mode: none
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        find /srv -mindepth 1 -maxdepth 1 -exec rm -rf -- '{}' +
        cp -R /dist/client/. /srv/
        test -f /srv/index.html
    volumes:
      - frontend_static:/srv
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *service-logging

  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    init: true
    environment:
      CLINIC_SITE_ADDRESS: ${CLINIC_SITE_ADDRESS:?CLINIC_SITE_ADDRESS를 .env에 설정하세요}
      CADDY_ALLOWED_SUBNETS: ${CADDY_ALLOWED_SUBNETS:?CADDY_ALLOWED_SUBNETS를 .env에 설정하세요}
      CLINIC_HOSTNAME: ${CLINIC_HOSTNAME:?CLINIC_HOSTNAME을 .env에 설정하세요}
    ports:
      - "${CLINIC_BIND_ADDRESS:-0.0.0.0}:${CLINIC_HTTPS_PORT:-443}:443"
    volumes:
      - ./deployment/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - frontend_static:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend-build:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
    networks:
      - edge
      - application
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q --spider http://127.0.0.1:8080/healthz
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    logging: *service-logging

volumes:
  postgres_data:
  frontend_static:
  caddy_data:
  caddy_config:

networks:
  # Host에 공개되는 Port는 edge에 연결된 Caddy의 HTTPS 하나뿐이다.
  edge:
    driver: bridge
  # Backend는 Caddy에서만 접근할 수 있고 Host Port를 Publish하지 않는다.
  application:
    driver: bridge
    internal: true
  # PostgreSQL은 Backend와 Migration에서만 접근하며 Host Port를 Publish하지 않는다.
  database:
    driver: bridge
    internal: true
